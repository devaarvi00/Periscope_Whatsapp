services:

  # ── MySQL ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: hyperscope_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: whatsapp_periscope
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hyperscope
    healthcheck:
      # $$ defers expansion to the container shell, so the password is passed via
      # MYSQL_PWD instead of appearing in the healthcheck command / docker inspect.
      # (MYSQL_PWD is not set container-wide: it would break the image's first-run init.)
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB (chats + messages) ─────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: hyperscope_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-hyperscope}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    networks:
      - hyperscope
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── WAHA (WhatsApp HTTP API) ───────────────────────────────────────
  waha:
    # Pinned by digest: the image previously used as :latest (built 2026-07-15).
    # Upstream only publishes :latest for the free core image, so bump this
    # digest deliberately after testing a newer WAHA release.
    image: devlikeapro/waha@sha256:dc134637dfa0bd65202010a65e4ff8176101791699176c75bb37d5aa9daf487c
    container_name: hyperscope_waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_data:/app/.wwebjs_auth
    networks:
      - hyperscope
    # Not published: the app reaches WAHA over the internal network.
    # Docker-published ports bypass UFW, so never expose 3000 publicly. For
    # temporary dashboard access, bind loopback only and use an SSH tunnel:
    # ports:
    #   - "127.0.0.1:3000:3000"

  # ── Hyperscope App ──────────────────────────────────────────────────
  app:
    build: .
    container_name: hyperscope_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DB URLs to use Docker service names
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/whatsapp_periscope
      # Credentials must be URL-safe (or percent-encoded) to embed here
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-hyperscope}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      WAHA_BASE_URL: http://waha:3000
      # Webhook URL must be the public domain so WAHA container can reach nginx
      PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      waha:
        condition: service_started
    networks:
      - hyperscope
    expose:
      - "8000"

  # ── Nginx (reverse proxy + SSL termination) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hyperscope_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # Put your SSL certs here
    depends_on:
      - app
    networks:
      - hyperscope

volumes:
  mysql_data:
  mongo_data:
  waha_data:
  waha_sessions:

networks:
  hyperscope:
    driver: bridge
