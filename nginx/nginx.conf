worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Rate limiting — 20 req/s per IP, burst 50
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # Tighter limit on auth endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # WebSocket upgrade: send "upgrade" only when the client asked for it
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream hyperscope_app {
        server app:8000;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;   # nginx >= 1.25.1 syntax ("listen ... http2" is deprecated)
        server_name YOUR_DOMAIN.com;   # ← Replace with your domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers (`always` so they are sent on error responses too).
        # X-XSS-Protection is intentionally omitted: obsolete and ignored by
        # modern browsers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 25M;

        # Forwarding headers for every location (uvicorn runs with --proxy-headers).
        # Inherited by each location below as none of them set proxy_set_header.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth endpoints — strict rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://hyperscope_app;
        }

        # WAHA webhooks (router prefix /api/v1/webhooks) — no per-IP API rate
        # limit: all events arrive from the WAHA container's single IP in bursts.
        location /api/v1/webhooks/ {
            proxy_pass http://hyperscope_app;
            proxy_read_timeout 120s;
        }

        # WebSocket
        location /ws {
            proxy_pass http://hyperscope_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            # Setting any proxy_set_header here drops the inherited ones
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API — standard rate limit
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://hyperscope_app;
            proxy_read_timeout 120s;
        }

        # Frontend SPA
        location / {
            proxy_pass http://hyperscope_app;
        }
    }
}
